# Локальное окружение для разработки: база + раннер кода.
# Запуск:    docker compose up -d
# Остановка: docker compose down        (данные сохраняются)
# Снести всё вместе с данными: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: codegolf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codegolf}
      # На сервере задайте POSTGRES_PASSWORD в .env — тем же значением,
      # что стоит в DATABASE_URL. Значение по умолчанию только для локальной работы
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codegolf}
      POSTGRES_DB: ${POSTGRES_DB:-codegolf}
    # Скромные настройки под сервер с 2 ГБ памяти
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    # Только с этого компьютера, наружу не торчит
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codegolf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codegolf -d codegolf"]
      interval: 5s
      timeout: 3s
      retries: 12

  piston:
    # Тот же раннер, что стоял на сервере
    image: ghcr.io/engineer-man/piston:latest
    container_name: codegolf-piston
    restart: unless-stopped
    # Piston изолирует чужой код сам и без этого не работает
    privileged: true
    # ВАЖНО: только 127.0.0.1 — этот порт запускает произвольный код,
    # его нельзя открывать в локальную сеть
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - codegolf-piston-packages:/piston/packages
    environment:
      PISTON_RUN_TIMEOUT: 12000
      PISTON_COMPILE_TIMEOUT: 12000
      PISTON_OUTPUT_MAX_SIZE: 65536
    # Сервер — 2 ядра и 4 ГБ (с 23 сентября 2026): раннеру отдано одно ядро,
    # второе остаётся сайту и базе. Без лимитов одно тяжёлое решение участника
    # подвешивает весь сайт. Сборка C# на полном ядре идёт вдвое быстрее, чем на половине
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200

volumes:
  codegolf-db-data:
  codegolf-piston-packages:
