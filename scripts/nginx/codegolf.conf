# Обратный прокси перед сайтом.
# 1) замените __DOMAIN__ на свой домен
# 2) sudo cp scripts/nginx/codegolf.conf /etc/nginx/sites-available/codegolf
#    sudo ln -sf /etc/nginx/sites-available/codegolf /etc/nginx/sites-enabled/codegolf
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
# 3) sudo certbot --nginx -d __DOMAIN__   — сертификат и переход на HTTPS
#    certbot сам допишет в этот файл блок с TLS и редирект с http

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Решения короткие, большие тела запросов не нужны
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ВАЖНО: перезаписываем, а не добавляем ($proxy_add_x_forwarded_for).
        # Иначе посетитель может подставить свой X-Forwarded-For и обойти
        # ограничение частоты отправок
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Проверка решения может занимать до 15 секунд
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Статика сборки: отдаём надолго, она версионируется по имени файла
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
